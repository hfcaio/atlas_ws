# atlas-sim : ambiente ROS 2 Humble + Gazebo Harmonic + ArduPilot SITL + MAVROS
#
#   docker compose build
#   xhost +local:docker
#   docker compose run --rm dev            # shell: atlas-ws-init / atlas-deps / atlas-build
#   VEHICLE=copter docker compose up       # gazebo + sitl + mavros
#   docker compose down
#
# O workspace INTEIRO (src/ build_docker/ install_docker/) vem do host por volume.
# network_mode: host -> 127.0.0.1 e o mesmo em todos os containers e no host.

x-atlas: &atlas
  image: atlas-sim:humble
  build:
    context: .
    dockerfile: Dockerfile
    network: host        # build usa o DNS/rede do host (sem isto: 'Could not resolve host')
    args:
      ARDUPILOT_REF: ${ARDUPILOT_REF:-master}
      BUILD_ARDUPILOT: ${BUILD_ARDUPILOT:-1}
      WAF_JOBS: ${WAF_JOBS:-4}
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  network_mode: host
  ipc: host
  privileged: true
  working_dir: /home/ros/atlas_ws
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - QT_X11_NO_MITSHM=1
    - ATLAS_WS=/home/ros/atlas_ws
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - GZ_VERSION=harmonic
    - VEHICLE=${VEHICLE:-copter}
    - HEADLESS=${HEADLESS:-0}
    - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${ATLAS_WS_HOST:-..}:/home/ros/atlas_ws
    - ${HOME}/.ssh:/home/ros/.ssh:ro
    - ap_ccache:/home/ros/.cache/ccache
  stdin_open: true
  tty: true

services:

  gazebo:
    <<: *atlas
    container_name: atlas_gazebo
    command: ["ap-gazebo", "${VEHICLE:-copter}"]

  sitl:
    <<: *atlas
    container_name: atlas_sitl
    depends_on: [gazebo]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ATLAS_WS=/home/ros/atlas_ws
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - HEADLESS=${HEADLESS:-0}
      - WAIT_GAZEBO=${WAIT_GAZEBO:-8}
      - WIPE=${WIPE:-0}
      - SPEEDUP=${SPEEDUP:-1}
      - INSTANCE=${INSTANCE:-0}
    command: ["ap-sitl", "${VEHICLE:-copter}"]

  mavros:
    <<: *atlas
    container_name: atlas_mavros
    depends_on: [sitl]
    environment:
      - ATLAS_WS=/home/ros/atlas_ws
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FCU_URL=${FCU_URL:-udp://:14550@}
      - GCS_URL=${GCS_URL:-}
      - INSTANCE=${INSTANCE:-0}
    command: ["bash", "-lc", "sleep ${MAVROS_DELAY:-15}; ap-mavros"]

  dev:
    <<: *atlas
    container_name: atlas_dev
    profiles: ["dev"]
    command: ["bash"]

  # ---------------------------------------------------------------- ARTEX 2026
  # Missao de subida a 2000 m. SITL nativo de asa fixa (sem Gazebo) na pista do
  # ARTEX, a falar UDP directamente com o QGroundControl.
  #
  #   docker compose --profile artex up
  #
  # O QGC liga-se sozinho (escuta em UDP 14550). Depois, no QGC:
  #   Plan -> Open -> src/artex27/missions/artex27.plan -> Upload
  #   Fly  -> mudar o modo para AUTO e armar
  #
  # Nao ha MAVProxy: e' o proprio SITL que emite em UDP (--serial1). Assim o
  # protocolo de missao nao colide, e o TCP 5760 fica livre para o MAVROS.
  artex:
    <<: *atlas
    container_name: artex_sitl
    profiles: ["artex"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ATLAS_WS=/home/ros/atlas_ws
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ARDUPILOT_LOCATIONS=/home/ros/atlas_ws/src/artex27/tools/sim/locations.txt
    command:
      - bash
      - -lc
      - >-
        cd $$ARDUPILOT_HOME &&
        sim_vehicle.py -v ArduPlane -f plane
        -L ${ARTEX_LOCATION:-ARTEX_RUNWAY}
        --speedup ${SPEEDUP:-1}
        ${ARTEX_WIPE:--w}
        --no-mavproxy
        --add-param-file=/home/ros/atlas_ws/src/artex27/params/artex27_sitl.param
        -A "--serial0=tcp:0 --serial1=udpclient:127.0.0.1:14550"

volumes:
  ap_ccache:
